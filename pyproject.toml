[project]
name = "prstate"
version = "0.1.0"
description = "Normalized GitHub pull-request review state: CI verdict, what you owe humans, what bots still have open."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
prstate = "prstate.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prstate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
